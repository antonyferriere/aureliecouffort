name: Deploy PREPROD (FTPS)

on:
  push:
    branches: [preprod]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-preprod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/preprod'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    environment:
      name: PREPROD

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, Node 24
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0, Node 24
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check, build and test Astro
        env:
          PUBLIC_INDEXABLE: "false"
        run: |
          npm run check
          npm run build
          npm test
          test -s dist/index.html

      - name: Verify deployment destination
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
          FTP_SERVER: ${{ vars.FTP_SERVER || secrets.FTP_SERVER || 'trigone.o2switch.net' }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          # o2switch serves FTPS for this alias on its canonical server name.
          if [[ "$FTP_SERVER" == ftp.antonyferriere.net ]]; then
            FTP_SERVER=trigone.o2switch.net
          fi
          echo "FTP_SERVER=$FTP_SERVER" >> "$GITHUB_ENV"
          if [[ "$SITE_URL" != https://?* ]]; then
            echo "Set SITE_URL to the HTTPS homepage of the PREPROD site."
            exit 1
          fi
          # Le compte FTP ouvre directement sur le site : sa racine / est autorisée.
          if [[ -z "$FTP_DIR" || "$FTP_DIR" != */ || "$FTP_DIR" == *\\* ]]; then
            echo "FTP_DIR must be non-empty, use forward slashes, and end in /. Use / for the FTP account root."
            exit 1
          fi

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0, Node 24
        env:
          NODE_USE_SYSTEM_CA: "1"
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: dist/
          server-dir: ${{ secrets.FTP_DIR }}
          dangerous-clean-slate: false

      - name: Verify deployed HTTPS site
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
        run: |
          curl --proto '=https' --fail --silent --show-error --max-time 30 --retry 3 \
            --output "$RUNNER_TEMP/preprod-index.html" "$SITE_URL"
          cmp dist/index.html "$RUNNER_TEMP/preprod-index.html"
